name: Build & Release

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run package:cross
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"

  # Enforce the repo's own quality gates (format / lint / typecheck / unit tests).
  # Independent job (informational on PRs); add branch protection or `needs: check`
  # on release to make it blocking.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # NOT --ignore-scripts: zstd-napi builds its native binding.node in a
      # postinstall; without it `npm test` fails to load the module. The root
      # postinstall also installs webview-ui.
      - run: npm ci
      - run: npm run check
      - run: npm test

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: vsix
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: "*.vsix"
          generate_release_notes: true

  # Validate the bundled macOS 7zz on real Apple hardware (no Mac needed locally).
  # Downloads the same official (universal) binary the install script stages,
  # replicates the extension's runtime prep (quarantine strip + ad-hoc sign
  # fallback), and does a compress/extract round-trip — i.e. the exact execve the
  # extension performs via spawn.
  #
  # macos-15 (arm64) is free for public repos and is the higher-risk arch
  # (unsigned arm64 is SIGKILLed). The Intel slice of the same universal binary
  # is lower-risk (Intel does not kill unsigned) — free Intel runners are gone
  # (macos-13 retired), so to also cover Intel add the billable larger runner:
  #     matrix: { os: [macos-15, macos-15-large] }   # macos-15-large = Intel, costs minutes
  test-macos-7z:
    name: Validate bundled mac 7zz
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Download & validate macOS 7zz
        shell: bash
        run: |
          set -euo pipefail
          VER=$(sed -n 's/.*const VER = "\([^"]*\)".*/\1/p' scripts/install-7z-platforms.js)
          TAG=$(sed -n 's/.*const TAG = "\([^"]*\)".*/\1/p' scripts/install-7z-platforms.js)
          echo "Testing 7-Zip $VER on $(uname -m) — macOS $(sw_vers -productVersion)"

          curl -fsSL -o 7zmac.tar.xz "https://github.com/ip7z/7zip/releases/download/${VER}/7z${TAG}-mac.tar.xz"
          mkdir -p extract && tar -xf 7zmac.tar.xz -C extract
          BIN="$(find extract -type f -name 7zz | head -1)"
          test -n "$BIN" || { echo "::error::7zz not found in mac tarball"; exit 1; }
          chmod +x "$BIN"

          echo "── simulate a quarantined file (as if unpacked from a downloaded VSIX) ──"
          xattr -w com.apple.quarantine "0081;00000000;ci-test;" "$BIN"
          test -n "$(xattr -p com.apple.quarantine "$BIN" 2>/dev/null)" \
            || { echo "::error::could not set quarantine attribute for the test"; exit 1; }
          echo "quarantine attr set: $(xattr -p com.apple.quarantine "$BIN")"

          echo "── replicate the extension's runtime mac prep ──"
          xattr -d com.apple.quarantine "$BIN" 2>/dev/null || true
          if xattr -p com.apple.quarantine "$BIN" 2>/dev/null; then
            echo "::error::quarantine attribute was NOT removed by the strip step"; exit 1
          fi
          echo "quarantine attr removed ✔"
          if codesign --verify --no-strict "$BIN" 2>/dev/null; then
            echo "signature: VALID (Developer ID / notarized) — no ad-hoc signing needed"
          else
            echo "signature: missing/invalid → applying ad-hoc signature (extension fallback)"
            codesign --sign - --force "$BIN"
          fi
          codesign -dvv "$BIN" 2>&1 | sed -n '1,6p' || true
          spctl -a -vv -t exec "$BIN" 2>&1 || echo "(spctl exec assessment non-zero — informational; execve below is the real gate)"

          echo "── round-trip: exactly what the extension does (spawn 7zz) ──"
          "$BIN" | head -2
          mkdir -p src out
          printf 'hello 世界\n' > src/a.txt
          mkdir -p src/sub && printf 'nested\n' > src/sub/b.txt
          "$BIN" a -t7z test.7z ./src >/dev/null
          "$BIN" x -y -oout test.7z >/dev/null
          diff -r src out/src
          echo "✅ mac 7zz executed and round-tripped OK on $(uname -m)"

  # Validate the bundled Windows 7z.exe + 7z.dll on real Windows. The critical
  # check is DLL co-location: 7z.exe must find its adjacent 7z.dll (RAR etc. live
  # in the dll). Extracts the same official installer the install script uses and
  # runs the extracted 7z.exe for a compress/extract round-trip. windows-latest is
  # free for public repos.
  test-windows-7z:
    name: Validate bundled Windows 7z
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download & validate Windows 7z.exe + 7z.dll
        shell: bash
        run: |
          set -euo pipefail
          VER=$(sed -n 's/.*const VER = "\([^"]*\)".*/\1/p' scripts/install-7z-platforms.js)
          TAG=$(sed -n 's/.*const TAG = "\([^"]*\)".*/\1/p' scripts/install-7z-platforms.js)
          echo "Testing 7-Zip $VER on Windows"
          curl -fsSL -o inst.exe "https://github.com/ip7z/7zip/releases/download/${VER}/7z${TAG}-x64.exe"
          # Extract 7z.exe + 7z.dll from the SFX installer using the runner's preinstalled 7-Zip.
          SZ=$(command -v 7z || echo "/c/Program Files/7-Zip/7z.exe")
          "$SZ" x -y -obin inst.exe 7z.exe 7z.dll >/dev/null
          ls -l bin/7z.exe bin/7z.dll
          # Round-trip using OUR extracted 7z.exe — proves it loads the adjacent 7z.dll.
          mkdir -p src out
          printf 'hello world\n' > src/a.txt
          mkdir -p src/sub && printf 'nested\n' > src/sub/b.txt
          ./bin/7z.exe a -t7z test.7z ./src >/dev/null
          ./bin/7z.exe x -y -oout test.7z >/dev/null
          diff -r src out/src
          echo "✅ Windows 7z.exe executed with adjacent 7z.dll"
