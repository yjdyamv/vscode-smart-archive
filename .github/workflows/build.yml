name: Build & Release

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci --ignore-scripts
      - run: node scripts/install-lz4-platforms.js
      - run: node scripts/install-zstd-platforms.js
      - run: npm --prefix webview-ui ci --ignore-scripts
      - run: npm run build
      - run: npx vsce package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: "*.vsix"
          generate_release_notes: true
