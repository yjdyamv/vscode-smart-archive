name: Build & Release

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run package:cross
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"

  # Enforce the repo's own quality gates (format / lint / typecheck / unit tests).
  # Independent job (informational on PRs); add branch protection or `needs: check`
  # on release to make it blocking.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # NOT --ignore-scripts: zstd-napi builds its native binding.node in a
      # postinstall; without it `npm test` fails to load the module. The root
      # postinstall also installs webview-ui.
      - run: npm ci
      - run: npm run check
      - run: npm test

  # Exercise the RAR5 WASI fallback (wasm32-wasip1-threads): stages only the
  # wasm bundle from the smart-archive-rar release and forces the extension's
  # rar5 engine onto it (SA_RAR5_FORCE_WASM is set inside the test file).
  test-rar5-wasm:
    name: Test RAR5 WASI fallback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Stage RAR5 WASI bundle
        env:
          SA_RAR5_PLATFORMS: ""
          SA_RAR5_REQUIRE: "1"
        run: node scripts/install-rar5-platforms.js
      - run: npx vitest run test/rar5-wasm.test.ts

  test-snappy-wasm:
    name: Test snappy WASI fallback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Stage snappy native + WASI assets
        run: node scripts/install-snappy-platforms.js
      - run: npx vitest run test/snappy-wasm.test.ts

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: vsix
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: "*.vsix"
          generate_release_notes: true

  # Validate the bundled macOS 7zz on real Apple hardware (no Mac needed locally).
  # Downloads the same 7-Zip ZS arm64 binary the install script stages from
  # yjdyamv/7-Zip-zstd-native, replicates the extension's runtime prep
  # (quarantine strip + ad-hoc sign fallback), and does a compress/extract
  # round-trip — i.e. the exact execve the extension performs via spawn.
  #
  # macos-15 (arm64) is free for public repos and is the higher-risk arch
  # (unsigned arm64 is SIGKILLed). The ZS fork publishes arm64-only mac builds,
  # so there is no free Intel runner to cover — add the billable larger runner
  # if Intel coverage is ever needed:
  #     matrix: { os: [macos-15, macos-15-large] }   # macos-15-large = Intel, costs minutes
  test-macos-7z:
    name: Validate bundled mac 7zz
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Download & validate macOS 7zz
        shell: bash
        run: |
          set -euo pipefail
          REPO=$(node -p "require('./scripts/lib/releases.js').SEVEN_ZIP_ZSTD_REPO")
          TAG=$(node -p "require('./scripts/lib/releases.js').SEVEN_ZIP_ZSTD_TAG")
          VER=${TAG#v}; VER=${VER%%-*}
          echo "Testing 7-Zip $VER on $(uname -m) — macOS $(sw_vers -productVersion)"

          curl -fsSL -o 7zz-macos-arm64.tar.gz "https://github.com/${REPO}/releases/download/${TAG}/7zz-macos-arm64.tar.gz"
          mkdir -p extract && tar -xf 7zz-macos-arm64.tar.gz -C extract
          BIN="$(find extract -type f -name 7zz | head -1)"
          test -n "$BIN" || { echo "::error::7zz not found in mac tarball"; exit 1; }
          chmod +x "$BIN"

          echo "── simulate a quarantined file (as if unpacked from a downloaded VSIX) ──"
          xattr -w com.apple.quarantine "0081;00000000;ci-test;" "$BIN"
          test -n "$(xattr -p com.apple.quarantine "$BIN" 2>/dev/null)" \
            || { echo "::error::could not set quarantine attribute for the test"; exit 1; }
          echo "quarantine attr set: $(xattr -p com.apple.quarantine "$BIN")"

          echo "── replicate the extension's runtime mac prep ──"
          xattr -d com.apple.quarantine "$BIN" 2>/dev/null || true
          if xattr -p com.apple.quarantine "$BIN" 2>/dev/null; then
            echo "::error::quarantine attribute was NOT removed by the strip step"; exit 1
          fi
          echo "quarantine attr removed ✔"
          if codesign --verify --no-strict "$BIN" 2>/dev/null; then
            echo "signature: VALID (Developer ID / notarized) — no ad-hoc signing needed"
          else
            echo "signature: missing/invalid → applying ad-hoc signature (extension fallback)"
            codesign --sign - --force "$BIN"
          fi
          codesign -dvv "$BIN" 2>&1 | sed -n '1,6p' || true
          spctl -a -vv -t exec "$BIN" 2>&1 || echo "(spctl exec assessment non-zero — informational; execve below is the real gate)"

          echo "── round-trip: exactly what the extension does (spawn 7zz) ──"
          "$BIN" | head -2
          mkdir -p src out
          printf 'hello 世界\n' > src/a.txt
          mkdir -p src/sub && printf 'nested\n' > src/sub/b.txt
          "$BIN" a -t7z test.7z ./src >/dev/null
          "$BIN" x -y -oout test.7z >/dev/null
          diff -r src out/src
          echo "✅ mac 7zz executed and round-tripped OK on $(uname -m)"

  # Validate the bundled Windows 7zz.exe on real Windows. The ZS fork ships a
  # single static 7zz.exe (all codecs included, no adjacent 7z.dll), so this
  # downloads the same archive the install script stages from
  # yjdyamv/7-Zip-zstd-native, confirms the RAR codec is present, and runs a
  # compress/extract round-trip. windows-latest is free for public repos.
  test-windows-7z:
    name: Validate bundled Windows 7zz.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download & validate Windows 7zz.exe
        shell: bash
        run: |
          set -euo pipefail
          REPO=$(node -p "require('./scripts/lib/releases.js').SEVEN_ZIP_ZSTD_REPO")
          TAG=$(node -p "require('./scripts/lib/releases.js').SEVEN_ZIP_ZSTD_TAG")
          VER=${TAG#v}; VER=${VER%%-*}
          echo "Testing 7-Zip $VER on Windows"
          curl -fsSL -o 7zz-windows-x64.zip "https://github.com/${REPO}/releases/download/${TAG}/7zz-windows-x64.zip"
          # Git Bash's GNU tar cannot read zip archives; Windows' built-in
          # Expand-Archive handles the GitHub release zip reliably.
          mkdir -p bin && powershell -NoProfile -Command "Expand-Archive -Force -Path 7zz-windows-x64.zip -DestinationPath bin"
          BIN="$(find bin -type f -name 7zz.exe | head -1)"
          test -n "$BIN" || { echo "::error::7zz.exe not found in windows zip"; exit 1; }
          ls -l "$BIN"
          # The ZS fork statically links its codecs — confirm RAR is in the exe.
          "$BIN" i | grep -q 'Rar5' || { echo "::error::RAR5 codec missing from 7zz.exe"; exit 1; }
          "$BIN" | head -2
          # Round-trip using the exact bundled 7zz.exe.
          mkdir -p src out
          printf 'hello world\n' > src/a.txt
          mkdir -p src/sub && printf 'nested\n' > src/sub/b.txt
          "$BIN" a -t7z test.7z ./src >/dev/null
          "$BIN" x -y -oout test.7z >/dev/null
          diff -r src out/src
          echo "✅ Windows 7zz.exe executed and round-tripped OK"

  # Passwords must go to 7-Zip through stdin (never argv). This job runs the
  # real bundled 7zz on native Linux and Windows runners and exercises the
  # exact protocol the extension uses:
  #   - create: `-p` (empty switch) triggers the prompt, password via stdin
  #   - list/extract/test: no `-p` switch, 7z prompts and reads stdin
  #   - wrong passwords are rejected
  test-7z-stdin-password:
    name: Validate 7zz stdin password (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Download & extract 7zz
        shell: bash
        run: |
          set -euo pipefail
          REPO=$(node -p "require('./scripts/lib/releases.js').SEVEN_ZIP_ZSTD_REPO")
          TAG=$(node -p "require('./scripts/lib/releases.js').SEVEN_ZIP_ZSTD_TAG")
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ASSET=7zz-windows-x64.zip
          else
            ASSET=7zz-linux-x64.tar.gz
          fi
          curl -fsSL -o "$ASSET" "https://github.com/${REPO}/releases/download/${TAG}/${ASSET}"
          mkdir -p bin
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell -NoProfile -Command "Expand-Archive -Force -Path '$ASSET' -DestinationPath bin"
          else
            tar -xf "$ASSET" -C bin
          fi
          BIN="$(find bin -type f \( -name 7zz -o -name 7zz.exe \) | head -1)"
          test -n "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
      - name: Verify stdin password (create / list / extract / wrong-password)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src out
          printf 'hello stdin 密码\n' > src/a.txt
          # Create: empty -p triggers the prompt; the password arrives via stdin.
          printf 'pw123\n' | "$BIN" a -t7z -mhe=on -p enc.7z src/a.txt >/dev/null
          test -s enc.7z
          # List: no -p switch; 7z prompts and reads the password from stdin.
          printf 'pw123\n' | "$BIN" l -slt enc.7z | grep -q 'Encrypted = +'
          # Extract: same stdin protocol.
          printf 'pw123\n' | "$BIN" x -y -oout enc.7z >/dev/null
          diff -r src out/src
          # Wrong password must be rejected (no silent empty-password pass).
          if printf 'nope\n' | "$BIN" t enc.7z >/dev/null 2>&1; then
            echo "::error::wrong password unexpectedly accepted via stdin"
            exit 1
          fi
          echo "✅ stdin password protocol OK on ${{ matrix.os }}"
